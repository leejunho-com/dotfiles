[mgr]

prepend_keymap = [
	{ on = [ "q" ], run = 'close', desc = "Close tab, quit if last" },
	{ on = [ "<C-q>" ], run = 'quit', desc = "Exit yazi" },
  { on = "!", for = "macos", run = '''shell 'open -na Ghostty --args --working-directory="$PWD"' --block false''', desc = "Open Ghostty here" },
  { on = "!", for = "linux", run = 'shell "ghostty --working-directory=$PWD &" --block false', desc = "Open Ghostty here" },
# goto
  { on = [ "g", "/" ], for = "unix",  run = "cd /",            desc = "Go /"    },
  { on = [ "g", "t" ], for = "unix",  run = "cd /tmp",         desc = "Go /tmp" },
  { on = [ "g", "v" ], for = "macos", run = "cd /Volumes",     desc = "Go /Volumes"    },
  { on = [ "g", "v" ], for = "linux", run = "cd /mnt",         desc = "Go /mnt"        },
  { on = [ "g", "m" ], for = "macos", run = "cd ~/mnt",        desc = "Go ~/mnt"       },
  { on = [ "g", "m" ], for = "linux", run = "cd /mnt",         desc = "Go /mnt"        },
  { on = [ "g", "l" ], for = "unix",  run = "cd ~/Downloads",  desc = "Go ~/Downloads" },
  { on = [ "g", "d" ], for = "unix",  run = "cd ~/Desktop",    desc = "Go ~/Desktop"   },
  { on = [ "g", "o" ], for = "unix",  run = "cd ~/Documents",  desc = "Go ~/Documents" },
  { on = [ "g", "w" ], for = "macos", run = '''shell --confirm 'open -a "Parallels Desktop" %d1 && osascript -e "tell application \"Parallels Desktop\" to activate"' ''', desc = "Reveal in Windows" },

# edit
  { on = [ "e", "p" ], run = '''shell 'poster -d %h ' --interactive''', desc = "Crop fanart.jpg (l|ml|m|mr|r)" },

# clipboard — route through bin/copy; tmux drops yazi's own OSC 52 (see docs/troubleshooting)
  { on = [ "c", "c" ], run = '''shell 'copy %s' ''', desc = "cp file path" },
  { on = [ "c", "C" ], run = '''shell 'copy %S' ''', desc = "cp file URL" },
  { on = [ "c", "d" ], run = '''shell 'copy %d' ''', desc = "cp dir path" },
  { on = [ "c", "D" ], run = '''shell 'copy %D' ''', desc = "cp dir URL" },
  { on = [ "c", "b" ], run = '''shell 'for d in %d; do basename -- "$d"; done | copy' ''', desc = "cp dir name" },
  { on = [ "c", "f" ], run = '''shell 'for f in %s; do basename -- "$f"; done | copy' ''', desc = "cp filename" },
  { on = [ "c", "n" ], run = '''shell 'for f in %s; do basename -- "$f"; done | sed "s/\(.\)\.[^.]*$/\1/" | copy' ''', desc = "cp filename w/o ext" },

# tab — yazi 26.8.15 changed `Url::pair()`, so the builtin `tab_create --current`
# now stays in the search view instead of opening the file's real directory
  { on = [ "t", "t" ], run = '''shell 'ya emit -- tab_create --current && [ -n %h ] && ya emit -- reveal %h' ''', desc = "New tab in file's dir" },

# plugin
  # zoom
  {on   = "+", run  = "plugin zoom 1", desc = "Zoom in hovered file"},
  {on   = "-", run  = "plugin zoom -1", desc = "Zoom out hovered file"},
]
