[mgr]
show_hidden = false
sort_by = "natural"
linemode = "size"

[preview]
max_width = 2000
max_height = 3000
image_delay = 0   # default 30; send immediately instead of debouncing

[opener]
edit = [
  { run = 'nvim %s', block = true },
  { run = 'bat %s', block = true },
]
photoshop = [
  { for = "macos", run = 'open -a "Adobe Photoshop 2026" %s', desc = "Adobe Photoshop" },
]
unar = [
  { run = 'for rar in %s; do unar "$rar"; done', desc = "Extract with unar" },
]
mpv = [{ run = 'mpv %s', desc = "mpv" }]
firefox = [
  { run = 'for f in %s; do firefox --new-tab "file://$(realpath "$f")"; done', desc = "Firefox", orphan = true },
]

[open]
prepend_rules = [
  # archive
  { url = "*.{zip,7z}", use = [
    "extract",
    "mpv",
    "firefox",
    "reveal",
  ] },
  { url = "*.rar", use = [
    "unar",
    "mpv",
    "firefox",
    "reveal",
  ] },
  # image
  { url = "*.{jpg,jpeg,png,bmp,tif,tiff,gif,psd,webp,arw,dng}", use = [
    "mpv",
    "photoshop",
    "firefox",
    "reveal",
    "open",
  ] },
  # video
  { url = "*.{3gp,avi,mkv,mp4,webm,mov,ts,m2ts,mp3,flac,opus,m4a,wav,ogg,jpg,jpeg,png,webp,avif}", use = [
    "mpv",
    "firefox",
    "reveal",
  ] },
  # other
  { url = "*.smi", use = [
    "edit",
    "firefox",
  ] },
  # any file — Firefox in open-with menu (O)
  { url = "*", use = [
    "edit",
    "firefox",
    "reveal",
    "open",
  ] },
]

[tasks]
image_bound = [0, 0]
