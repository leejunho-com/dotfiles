[mgr]
show_hidden = false
sort_by = "natural"
linemode = "size"

[preview]
max_width = 2000
max_height = 3000
image_delay = 0   # default 30; send immediately instead of debouncing

[opener]
edit = [
  { run = 'nvim %s', block = true },
  { run = 'bat %s', block = true },
]
photoshop = [
  { for = "macos", run = 'open -a "Adobe Photoshop 2026" %s', desc = "Adobe Photoshop" },
]
unar = [
  { run = 'for rar in %s; do unar "$rar"; done', desc = "Extract with unar" },
]
mpv = [{ run = 'mpv %s', desc = "mpv" }]
quicktime = [
  { for = "macos", run = 'open -a "QuickTime Player" %s', desc = "QuickTime Player" },
]
firefox = [
  { run = 'for f in %s; do firefox --new-tab "file://$(realpath "$f")"; done', desc = "Firefox", orphan = true },
]

[open]
prepend_rules = [
  # archive
  { url = "*.{zip,7z}", use = [
    "extract",
    "mpv",
    "firefox",
    "reveal",
  ] },
  { url = "*.rar", use = [
    "unar",
    "mpv",
    "firefox",
    "reveal",
  ] },
  # image
  { url = "*.{avif,bmp,gif,jpg,jpeg,png,psd,tif,tiff,webp,arw,dng}", use = [
    "mpv",
    "photoshop",
    "firefox",
    "reveal",
    "open",
  ] },
  # video / audio — matches mpvTypes in home/darwin/default.nix
  { url = "*.{3gp,avi,m2ts,m2v,m4v,mkv,mov,mp4,mpeg,mpg,mts,ts,webm,wmv,aac,ac3,aif,aiff,flac,m4a,mka,mp3,ogg,opus,wav,wma}", use = [
    "mpv",
    "firefox",
    "quicktime",
    "reveal",
  ] },
  # other
  { url = "*.smi", use = [
    "edit",
    "firefox",
  ] },
  # any file — Firefox in open-with menu (O)
  { url = "*", use = [
    "edit",
    "firefox",
    "reveal",
    "open",
  ] },
]

[tasks]
image_bound = [0, 0]
